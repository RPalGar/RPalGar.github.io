<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubén Palenzuela</title>
<style>
  :root{--bg:#f4f2ee;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--accent:#0a66c2}
  @media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1f1f22;--ink:#f2f2f2;--muted:#a0a0a6}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
  main{width:100%;max-width:360px;background:var(--card);border-radius:20px;padding:32px 24px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  .foto{width:112px;height:112px;border-radius:50%;object-fit:cover;margin:0 auto 16px;display:block;background:#ddd}
  h1{font-size:1.5rem;margin:0 0 6px}
  p{margin:0 0 28px;color:var(--muted);line-height:1.4}
  a.btn{display:block;padding:14px;border-radius:12px;text-decoration:none;font-weight:600;margin-bottom:12px}
  .pri{background:var(--ink);color:var(--card)}
  .sec{background:var(--accent);color:#fff}
  small{display:block;margin-top:20px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <img class="foto" src="foto.jpg" alt="Rubén Palenzuela" onerror="this.style.display='none'">
  <h1>Rubén Palenzuela</h1>
  <p>De la logística a la IA aplicada.<br>Aprendo construyendo.</p>
  <a class="btn pri" href="ruben.vcf" download>Guardar contacto</a>
  <a class="btn sec" href="https://www.linkedin.com/in/rub%C3%A9n-palenzuela-imdisim">LinkedIn</a>
  <small>Arona · Tenerife</small>
</main>
</body>
</html>
